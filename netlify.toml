[build]
  publish = "."
  command = "node build.js"

# Chuyển địa chỉ cũ sang tên miền chính (301) để Google chuyển thứ hạng sang www.hothihang.vn
[[redirects]]
  from = "https://hothihang-mc.netlify.app/*"
  to = "https://www.hothihang.vn/:splat"
  status = 301
  force = true

